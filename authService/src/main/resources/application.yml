spring:
  application:
    name: authService

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

server:
  port: 8081
  servlet:
    context-path: /api
jwt:
  access:
    secret: ${JWT_ACCESS_SECRET}
  refresh:
    secret: ${JWT_REFRESH_SECRET}
